<div class="p-6 max-w-6xl mx-auto space-y-6">
  <div class="flex items-center justify-between mb-2">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Bandeja de Visitas</h2>
      <p class="text-gray-500 dark:text-gray-400 mt-1">Listado de pre-solicitudes físicas asignadas para verificación de campo hoy.</p>
    </div>
  </div>

  <app-card title="Ruta Asignada" [noPadding]="true">
    <app-table [columns]="['Folio', 'Prospecto', 'Dirección', 'Fecha Límite', 'Estado', 'Acción']" [isEmpty]="solicitudes.length === 0" emptyMessage="No tienes visitas pendientes.">
      <tr *ngFor="let solicitud of solicitudes" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
        <td class="px-6 py-4 font-bold text-gray-900 dark:text-white">{{ solicitud.folio }}</td>
        <td class="px-6 py-4 font-medium">{{ solicitud.nombre }}</td>
        <td class="px-6 py-4 text-gray-500">{{ solicitud.direccion }}</td>
        <td class="px-6 py-4">{{ solicitud.fechaAsignada }}</td>
        <td class="px-6 py-4">
          <app-badge [text]="solicitud.estado" variant="warning"></app-badge>
        </td>
        <td class="px-6 py-4">
          <app-button variant="primary" size="sm" (onClick)="iniciarVisita(solicitud.folio)">
            Iniciar Visita
          </app-button>
        </td>
      </tr>
    </app-table>
  </app-card>
</div>
