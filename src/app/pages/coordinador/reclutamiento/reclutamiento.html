<div class="p-6 max-w-5xl mx-auto space-y-6">
  <div class="flex items-center justify-between mb-2">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Módulo de Reclutamiento</h2>
      <p class="text-gray-500 dark:text-gray-400 mt-1">Captura de solicitud para nueva distribuidora (12 campos
        generales + datos adicionales).</p>
    </div>
  </div>

  @if (successMessage()) {
  <div class="p-4 text-sm text-green-800 rounded-lg bg-green-50 font-medium" role="alert">
    {{ successMessage() }}
  </div>
  }

  @if (errorMessage()) {
  <div class="p-4 text-sm text-red-800 rounded-lg bg-red-50 font-medium" role="alert">
    {{ errorMessage() }}
  </div>
  }

  <form class="space-y-6" (ngSubmit)="onSubmit()">

    <!-- Datos Generales (12 campos) -->
    <app-card title="1. Datos Generales" subtitle="Información personal del prospecto (12 campos requeridos)">
      <div class="space-y-6 mt-4">

        <!-- Nombre completo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <app-input label="Nombre" placeholder="Ej. Ana" [value]="nombre()" (valueChange)="nombre.set($event)"
            name="nombre" [disabled]="isSubmitting()">
          </app-input>
          <app-input label="Apellido Paterno" placeholder="Ej. García" [value]="apellidoPaterno()"
            (valueChange)="apellidoPaterno.set($event)" name="apellidoPaterno" [disabled]="isSubmitting()">
          </app-input>
          <app-input label="Apellido Materno" placeholder="Ej. Méndez" [value]="apellidoMaterno()"
            (valueChange)="apellidoMaterno.set($event)" name="apellidoMaterno" [disabled]="isSubmitting()">
          </app-input>
        </div>

        <!-- RFC y Fecha nacimiento -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <app-input label="RFC (13 caracteres)" placeholder="GAMA800101ABC"
            hint="Formato: 4 letras + 6 dígitos + 3 alfanuméricos" [value]="rfc()" (valueChange)="rfc.set($event)"
            name="rfc" [disabled]="isSubmitting()">
          </app-input>
          <app-input label="Fecha de Nacimiento" type="date" [value]="fechaNacimiento()"
            (valueChange)="fechaNacimiento.set($event)" name="fechaNacimiento" [disabled]="isSubmitting()">
          </app-input>
        </div>

        <!-- Dirección -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <app-input label="Calle" placeholder="Ej. Av. Juárez" [value]="calle()" (valueChange)="calle.set($event)"
            name="calle" [disabled]="isSubmitting()">
          </app-input>
          <app-input label="Número" placeholder="Ej. 123" [value]="numero()" (valueChange)="numero.set($event)"
            name="numero" [disabled]="isSubmitting()">
          </app-input>
          <app-input label="Colonia" placeholder="Ej. Centro" [value]="colonia()" (valueChange)="colonia.set($event)"
            name="colonia" [disabled]="isSubmitting()">
          </app-input>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <app-input label="Código Postal (5 dígitos)" placeholder="Ej. 44100" [value]="codigoPostal()"
            (valueChange)="codigoPostal.set($event)" name="codigoPostal" [disabled]="isSubmitting()">
          </app-input>
          <app-input label="Lugar de Nacimiento" placeholder="Ej. Guadalajara" [value]="lugarNacimiento()"
            (valueChange)="lugarNacimiento.set($event)" name="lugarNacimiento" [disabled]="isSubmitting()">
          </app-input>
        </div>

        <!-- Estado y Ciudad -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="estado-select" class="block mb-2 text-sm font-bold text-gray-900 dark:text-white">Estado</label>
            <select id="estado-select"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              [value]="estado()" (change)="estado.set($any($event.target).value)" [disabled]="isSubmitting()">
              <option value="">Selecciona un estado</option>
              @for (est of estadosMexicanos; track est) {
              <option [value]="est">{{ est }}</option>
              }
            </select>
          </div>
          <app-input label="Ciudad" placeholder="Ej. Guadalajara" [value]="ciudad()" (valueChange)="ciudad.set($event)"
            name="ciudad" [disabled]="isSubmitting()">
          </app-input>
        </div>

      </div>
    </app-card>

    <!-- Datos Adicionales: Domicilio -->
    <app-card title="2. Datos del Domicilio" subtitle="Información sobre la vivienda del prospecto">
      <div class="space-y-6 mt-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="situacion-select" class="block mb-2 text-sm font-bold text-gray-900 dark:text-white">Situación
              de Vivienda</label>
            <select id="situacion-select"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              [value]="domicilioSituacion()" (change)="domicilioSituacion.set($any($event.target).value)"
              [disabled]="isSubmitting()">
              <option value="">Selecciona</option>
              <option value="PROPIA">Propia</option>
              <option value="RENTADA">Rentada</option>
              <option value="LIQUIDADA">Liquidada</option>
              <option value="INFONAVIT">Infonavit</option>
              <option value="PRESTAMO_BANCARIO">Préstamo Bancario</option>
            </select>
          </div>
          <app-input label="m² de Construcción" type="number" placeholder="Ej. 120"
            [value]="domicilioM2()?.toString() ?? ''" (valueChange)="domicilioM2.set(+$event || undefined)" name="m2"
            [disabled]="isSubmitting()">
          </app-input>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <app-input label="Recámaras" type="number" placeholder="Ej. 3"
            [value]="domicilioRecamaras()?.toString() ?? ''"
            (valueChange)="domicilioRecamaras.set(+$event || undefined)" name="recamaras" [disabled]="isSubmitting()">
          </app-input>
          <app-input label="Pisos" type="number" placeholder="Ej. 2" [value]="domicilioPisos()?.toString() ?? ''"
            (valueChange)="domicilioPisos.set(+$event || undefined)" name="pisos" [disabled]="isSubmitting()">
          </app-input>
          <app-input label="Años de Residencia" type="number" placeholder="Ej. 5"
            [value]="domicilioResidencia()?.toString() ?? ''"
            (valueChange)="domicilioResidencia.set(+$event || undefined)" name="residencia" [disabled]="isSubmitting()">
          </app-input>
        </div>
      </div>
    </app-card>

    <!-- Botón de envío -->
    <div class="pt-4 flex justify-end gap-3 border-t border-gray-100 dark:border-gray-700 mt-6 pt-6">
      <app-button type="submit" variant="primary" [disabled]="!canSubmit()">
        @if (isSubmitting()) {
        Creando solicitud...
        } @else {
        Generar Solicitud
        }
      </app-button>
    </div>

  </form>
</div>
