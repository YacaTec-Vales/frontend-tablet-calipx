<div class="antialiased bg-gray-50 dark:bg-gray-900 h-screen font-sans flex overflow-hidden">

  <!-- Sidebar -->
  <aside [class.w-64]="isSidebarOpen" [class.w-24]="!isSidebarOpen"
    class="flex-shrink-0 h-screen bg-white border-r border-gray-200 dark:bg-gray-800 dark:border-gray-700 flex flex-col z-40 transition-all duration-300 ease-in-out"
    aria-label="Sidenav">
    <div class="overflow-y-auto py-5 h-full flex flex-col">
      <div class="mb-10 flex items-center justify-between cursor-pointer px-3 group" (click)="toggleSidebar()"
        title="Desplegar/Ocultar Menú">
        <div class="flex items-center">
          <img src="Group 9.svg" class="w-10 h-10 object-contain flex-shrink-0" alt="Logo" />
          <span *ngIf="isSidebarOpen"
            class="ml-3 text-xl font-bold whitespace-nowrap text-brand dark:text-brand-light transition-opacity duration-300">Coordinador</span>
        </div>
        <!-- Chevron Indicator -->
        <div class="p-1 rounded-md bg-gray-100 hover:bg-gray-200 text-gray-500 transition-colors">
          <svg *ngIf="isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
          <svg *ngIf="!isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>
      </div>

      <ul class="space-y-2 flex-1 px-3">
        <li>
          <a routerLink="/coordinador/bandeja" routerLinkActive="bg-gray-100 dark:bg-gray-700 text-brand font-bold"
            [title]="!isSidebarOpen ? 'Bandeja' : ''"
            class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true"
              class="w-6 h-6 flex-shrink-0 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white"
              fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4">
              </path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 transition-opacity duration-300">Bandeja</span>
          </a>
        </li>
        <li>
          <a routerLink="/coordinador/reclutamiento"
            routerLinkActive="bg-gray-100 dark:bg-gray-700 text-brand font-bold"
            [title]="!isSidebarOpen ? 'Reclutamiento' : ''"
            class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true"
              class="w-6 h-6 flex-shrink-0 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white"
              fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z">
              </path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 transition-opacity duration-300">Reclutamiento</span>
          </a>
        </li>
        <li>
          <a routerLink="/coordinador/auditoria" routerLinkActive="bg-gray-100 dark:bg-gray-700 text-brand font-bold"
            [title]="!isSidebarOpen ? 'Auditoría (Edición)' : ''"
            class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true"
              class="w-6 h-6 flex-shrink-0 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white"
              fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
              <path fill-rule="evenodd"
                d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z"
                clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 transition-opacity duration-300">Auditoría</span>
          </a>
        </li>
        <li>
          <a routerLink="/coordinador/incentivos" routerLinkActive="bg-gray-100 dark:bg-gray-700 text-brand font-bold"
            [title]="!isSidebarOpen ? 'Incentivos' : ''"
            class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true"
              class="w-6 h-6 flex-shrink-0 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white"
              fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd"
                d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z"
                clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 transition-opacity duration-300">Incentivos</span>
          </a>
        </li>
        <li>
          <a routerLink="/coordinador/transferencias"
            routerLinkActive="bg-gray-100 dark:bg-gray-700 text-brand font-bold"
            [title]="!isSidebarOpen ? 'Transferencias' : ''"
            class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true"
              class="w-6 h-6 flex-shrink-0 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white"
              fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M8 5a1 1 0 100 2h5.586l-1.293 1.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L13.586 5H8zM12 15a1 1 0 100-2H6.414l1.293-1.293a1 1 0 10-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L6.414 15H12z">
              </path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 transition-opacity duration-300">Transferencias</span>
          </a>
        </li>
        <li>
          <a routerLink="/coordinador/tokens" routerLinkActive="bg-gray-100 dark:bg-gray-700 text-brand font-bold"
            [title]="!isSidebarOpen ? 'Autorizaciones (Tokens)' : ''"
            class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true"
              class="w-6 h-6 flex-shrink-0 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white"
              fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd"
                d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 transition-opacity duration-300">Autorizaciones</span>
          </a>
        </li>

      </ul>

      <!-- User Profile / Logout -->
      <ul class="space-y-2 mt-4 pt-4 border-t border-gray-200 dark:border-gray-700 px-3">
        <li>
          <a href="#" (click)="logout($event)" [title]="!isSidebarOpen ? 'Cerrar Sesión' : ''"
            class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900 dark:hover:text-red-400 group transition-colors overflow-hidden">
            <svg aria-hidden="true"
              class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-red-600 dark:group-hover:text-red-400"
              fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd"
                d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z"
                clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Cerrar Sesión</span>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <main class="flex-1 w-full h-full flex flex-col bg-gray-50 dark:bg-gray-900 overflow-y-auto min-w-0 transition-all">
    <div class="p-4 md:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
