<div class="p-6 max-w-6xl mx-auto space-y-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Mis Distribuidoras</h2>
      <p class="text-gray-500 dark:text-gray-400 mt-1">
        Listado de distribuidoras bajo tu coordinación.
      </p>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Search Input -->
      <div class="relative w-64">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
          </svg>
        </div>
        <input type="text" 
          [value]="searchQuery()" 
          (input)="onSearchChange($any($event.target).value)"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" 
          placeholder="Buscar folio, nombre...">
      </div>

      <!-- Status Filter -->
      <select 
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
        [value]="statusFilter()" (change)="statusFilter.set($any($event.target).value)">
        <option value="">Todos los estados</option>
        <option value="ACTIVA">Activa</option>
        <option value="MOROSA">Morosa</option>
        <option value="DESHABILITADA">Deshabilitada</option>
        <option value="BAJA_VOLUNTARIA">Baja Voluntaria</option>
      </select>
    </div>
  </div>

  <app-card [noPadding]="true">
    <app-table [columns]="['Número', 'Límite Crédito', 'Disponible', 'Estado', 'Acciones']">
      <tr *ngFor="let d of distribuidoras()" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
        <td class="px-6 py-4 font-bold text-gray-900 dark:text-white">{{ d.distributorNumber }}</td>
        <td class="px-6 py-4">${{ (d.creditLimitCents / 100).toFixed(2) }}</td>
        <td class="px-6 py-4">${{ (d.creditAvailableCents / 100).toFixed(2) }}</td>
        <td class="px-6 py-4">
          <app-badge [text]="d.status" [variant]="getBadgeVariant(d.status)"></app-badge>
        </td>
        <td class="px-6 py-4">
          <app-button variant="outline" size="sm" (onClick)="verDetalle(d.id)">Ver Detalle</app-button>
        </td>
      </tr>

      <!-- Estado vacío -->
      <tr *ngIf="distribuidoras().length === 0 && !isLoading()">
        <td colspan="5" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">
          No tienes distribuidoras asignadas actualmente.
        </td>
      </tr>
    </app-table>

    <!-- Loading -->
    <div *ngIf="isLoading()" class="flex justify-center items-center p-8 border-t border-gray-100 dark:border-gray-700">
      <div class="text-gray-500 dark:text-gray-400">Cargando distribuidoras...</div>
    </div>

    <!-- Pagination -->
    <div *ngIf="distribuidoras().length > 0" class="p-4 border-t border-gray-200 dark:border-gray-700">
      <app-pagination
        [totalItems]="totalItems()"
        [(itemsPerPage)]="itemsPerPage"
        [(currentPage)]="currentPage">
      </app-pagination>
    </div>
  </app-card>

  <div *ngIf="errorMessage()" class="p-4 mt-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400">
    {{ errorMessage() }}
  </div>
</div>
