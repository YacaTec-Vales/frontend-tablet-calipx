<div [class]="'w-full bg-white border border-gray-200 rounded-2xl shadow-sm dark:bg-gray-800 dark:border-gray-700 transition-all ' + extraClasses()">
  
  <div *ngIf="title()" class="px-5 py-4 border-b border-gray-100 dark:border-gray-700">
      <h5 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">{{ title() }}</h5>
      <p *ngIf="subtitle()" class="font-normal text-sm text-gray-500 dark:text-gray-400 mt-1">{{ subtitle() }}</p>
  </div>
  
  <div [class.p-5]="!noPadding()">
      <ng-content></ng-content>
  </div>

</div>
