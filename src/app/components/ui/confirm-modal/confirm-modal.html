<div class="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col transform transition-all animate-in zoom-in-95 duration-200">
    <div class="p-6">
      <div class="flex items-center gap-4 mb-4">
        <div [class]="variant() === 'error' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'" class="w-12 h-12 rounded-full flex items-center justify-center shrink-0">
          @if (variant() === 'error') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          } @else {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          }
        </div>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white">{{ title() }}</h3>
      </div>
      <p class="text-gray-600 dark:text-gray-300 text-base mb-2 pl-16">
        {{ message() }}
      </p>
    </div>
    
    <div class="bg-gray-50 dark:bg-gray-750 px-6 py-4 flex flex-col sm:flex-row justify-end gap-3 rounded-b-2xl border-t border-gray-100 dark:border-gray-700">
      <app-button variant="secondary" (onClick)="cancel.emit()" [disabled]="isLoading()">
        {{ cancelText() }}
      </app-button>
      <app-button [variant]="variant()" (onClick)="confirm.emit()" [disabled]="isLoading()">
        <span class="flex items-center justify-center gap-2">
          @if (isLoading()) {
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Procesando...
          } @else {
            {{ confirmText() }}
          }
        </span>
      </app-button>
    </div>
  </div>
</div>
