@if (isValidResolution()) {
  <router-outlet></router-outlet>
} @else {
  <div class="fixed inset-0 z-[9999] bg-gray-900/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white rounded-2xl p-8 max-w-md shadow-2xl animate-in zoom-in duration-300">
      <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>
      <h2 class="text-3xl font-bold text-gray-900 mb-3">Resolución No Soportada</h2>
      <p class="text-gray-600 mb-6 text-lg">Esta aplicación está diseñada <strong>exclusivamente para Tablets</strong> (resolución entre 768px y 1366px).</p>
      <div class="bg-blue-50 text-blue-800 p-4 rounded-lg text-sm font-medium">
        Por favor, accede desde una Tablet o ajusta el tamaño de tu ventana si estás en un emulador o computadora de escritorio.
      </div>
    </div>
  </div>
}
